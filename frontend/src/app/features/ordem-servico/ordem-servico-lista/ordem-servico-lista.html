<div class="container">
  <h2>Painel do Mecânico - Ordens de Serviço</h2>

  @if (carregando()) {
    <p>A carregar ordens de serviço...</p>
  } @else if (erro()) {
    <p class="erro">{{ erro() }}</p>
  } @else {
    <div class="cards-grid">
      @for (item of ordens(); track item._id || item.id) {
        <app-ordem-servico-card 
          [os]="item" 
          (statusChange)="onMudarStatus($event.id, $event.novoStatus)" />
      } @empty {
        <p class="mensagem-vazia">Nenhuma ordem de serviço encontrada.</p>
      }
    </div>
  }
</div>
