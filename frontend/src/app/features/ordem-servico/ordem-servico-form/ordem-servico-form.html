<div class="container mt-4">
  <h2>Editar Ordem de Serviço</h2>

  <form (ngSubmit)="salvar()" class="mt-3">
    <div class="mb-3">
      <label for="descricao" class="form-label">Descrição do Problema</label>
      <input 
        type="text" 
        id="descricao" 
        class="form-control" 
        [ngModel]="descricaoProblema()" 
        (ngModelChange)="descricaoProblema.set($event)" 
        name="descricaoProblema" 
        required 
      />
    </div>

    <div class="mb-3">
      <label for="status" class="form-label">Status da Ordem</label>
      <select 
        id="status" 
        class="form-select" 
        [ngModel]="status()" 
        (ngModelChange)="status.set($event)" 
        name="status"
      >
        <option *ngFor="let s of listaStatus" [value]="s">{{ s }}</option>
      </select>
    </div>

    <button type="submit" class="btn btn-primary me-2">Salvar Alterações</button>
    <a routerLink="/ordem-servico" class="btn btn-secondary">Cancelar</a>
  </form>
</div>
