<article class="os-card">
  <header class="os-card-header">
    <div class="os-identificacao">
      <span
        class="status-chip"
        [class.status-recebido]="os().status === 'Veículo recebido - Aguardando Avaliação'"
        [class.status-manutencao]="os().status === 'Em manutenção'"
        [class.status-pecas]="os().status === 'Aguardando Peças'"
        [class.status-pronto]="os().status === 'Pronto para retirada'"
      >
        {{ os().status }}
      </span>

      <h3>{{ os().veiculo }}</h3>
      <p class="placa">{{ os().placa }}</p>
    </div>
  </header>

  <div class="os-card-dados">
    <div class="dado">
      <span class="dado-label">Cliente</span>
      <strong>{{ os().cliente }}</strong>
    </div>

    <div class="dado">
      <span class="dado-label">Data de entrada</span>
      <strong>{{ os().dataEntrada | date: 'dd/MM/yyyy' }}</strong>
    </div>

    <div class="dado problema">
      <span class="dado-label">Problema relatado</span>
      <p>{{ os().descricaoProblema }}</p>
    </div>
  </div>

  <footer class="os-card-acoes">
    <button
      type="button"
      class="btn-editar"
      (click)="abrirEdicao()"
    >
      Editar
    </button>
  </footer>
</article>
