<div class="login-container">
  <div class="login-card">
    <h2>Acesso Administrativo</h2>
    <p class="subtitle">Garagem Pro - Painel de Controle</p>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      
      <div class="form-group">
        <label for="email">E-mail</label>
        <input 
          type="email" 
          id="email" 
          formControlName="email" 
          placeholder="admin@oficina.com"
        />
        <div class="error-message" *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
          Digite um e-mail válido.
        </div>
      </div>

      <div class="form-group">
        <label for="senha">Senha</label>
        <input 
          type="password" 
          id="senha" 
          formControlName="senha" 
          placeholder="********"
        />
        <div class="error-message" *ngIf="loginForm.get('senha')?.invalid && loginForm.get('senha')?.touched">
          A senha deve ter pelo menos 6 caracteres.
        </div>
      </div>

      <div class="alert-pendencia" *ngIf="errorMessage">
  {{ errorMessage }}
</div>

      <button type="submit" [disabled]="loginForm.invalid" class="btn-submit">
        Entrar
      </button>
    </form>
  </div>
</div>
